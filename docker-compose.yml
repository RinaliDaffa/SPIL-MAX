services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: spil-max-backend:latest
    container_name: spil-max-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_PATH: /data/spil-max.sqlite
      UPLOAD_DIR: /uploads
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    volumes:
      - spil_max_db:/data
      - spil_max_uploads:/uploads
    expose:
      - "4000"
    networks:
      - spil_max_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: spil-max-frontend:latest
    container_name: spil-max-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    networks:
      - spil_max_net

volumes:
  spil_max_db:
    name: spil_max_db
  spil_max_uploads:
    name: spil_max_uploads

networks:
  spil_max_net:
    name: spil-max-net
    driver: bridge
