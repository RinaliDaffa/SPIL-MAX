server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow up to 500 MB MP4 uploads to Studio Kurator
    client_max_body_size 500M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/vtt;

    # Reverse proxy REST API to backend container
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # Reverse proxy uploaded videos/posters with HTTP 206 byte-range support
    location /uploads/ {
        proxy_pass http://backend:4000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
    }

    # Long-term cache for immutable hashed JS/CSS bundles & static media
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
