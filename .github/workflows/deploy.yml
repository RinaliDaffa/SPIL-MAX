name: Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: spil-max-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # .env lives in this same working directory on the runner and is
          # gitignored — a clean checkout (git clean -ffdx) would delete it.
          clean: false

      - name: Build and start containers
        run: docker compose up -d --build

      - name: Remove dangling images
        run: docker image prune -f
