name: SPIL MAX CI

on:
  push:
    branches: [main, frontend, backend]
  pull_request:
    branches: [main]

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install & Build Backend (TypeScript + SQLite API)
        working-directory: ./backend
        run: |
          npm ci
          npm run build

      - name: Install & Build Frontend (Vite + React + TypeScript)
        working-directory: ./frontend
        run: |
          npm ci
          npm run build
